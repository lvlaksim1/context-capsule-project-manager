name: Project Manager CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare installed Project Manager fixture
        run: |
          python installer/pmctl.py install \
            --target . \
            --repository lvlaksim1/context-capsule-project-manager \
            --branch main \
            --core-commit "$GITHUB_SHA"
      - name: Run Project Manager tests
        run: python -m unittest discover -s tests -v
      - name: Compile lifecycle modules
        run: python -m compileall -q installer
      - name: CLI help smoke
        run: python installer/pmctl.py --help
